{#- The shell for the one page a stranger can reach: the password prompt.
    No sprite, no nav, no wordmark. The linked stylesheet is public, so a
    test reads it for the same words this page must not say. -#}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{ title }}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="256x256" href="/static/relay-mark.png">
<link rel="apple-touch-icon" href="/static/relay-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ css_href }}">
</head>
<body class="min-h-screen"><main class="main">{% block body %}{% endblock %}</main></body>
</html>
